[project]
name = "personal-vault"
version = "0.1.0"
description = "A password manager that lives in the browser extension; this package is the Python reference the extension is tested against"
readme = "README.md"
requires-python = ">=3.12"
# Nothing here ships: the product is the browser extension in extension/. The
# Python code in app/ is the reference implementation of the vault format used
# by the tests, so its one library, pykeepass, is a development dependency.
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.7",
    "hypothesis>=6",
    "mypy>=1",
    "pip-audit>=2",
    "playwright>=1.64.0",
    "pre-commit>=3",
    "pykeepass>=4.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/src/personal_vault"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app/src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast pure-logic tests",
    "integration: tests that touch files or vaults",
    "security: invariant and canary tests (I1-I3)",
    "sync: the sync decision table",
    "e2e: browser end-to-end tests (Playwright)",
    "slow: the long crash-during-save loop",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "app/src"
files = ["app/src/personal_vault"]

[[tool.mypy.overrides]]
# pykeepass ships no py.typed marker, so mypy cannot check calls into it
module = ["pykeepass", "pykeepass.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["app/tests"]
