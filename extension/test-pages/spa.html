<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in (single-page app)</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <div id="app">
      <!-- No <form> element: the fields are plain inputs, the button is a
           div with a click handler, and the login is a fetch with no reload. -->
      <div class="field"><input id="username" placeholder="Username or email" /></div>
      <div class="field"><input id="password" type="password" placeholder="Password" /></div>
      <div id="submit" role="button" tabindex="0">Log in</div>
    </div>
    <script>
      document.getElementById("submit").addEventListener("click", async () => {
        await fetch("welcome.html");
        history.pushState({}, "", "#dashboard");
        document.getElementById("app").innerHTML = '<p id="done">Welcome back.</p>';
      });
    </script>
  </body>
</html>
