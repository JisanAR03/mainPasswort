<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <form id="login" action="?submitted=1" method="get">
      <label>Username <input id="username" name="username" type="text" autocomplete="username" /></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" /></label>
      <button id="submit" type="submit">Sign in</button>
    </form>
    <script>
      // A real submit navigates to ?submitted=1; the test asserts the URL
      // never changes after a fill.
      window.__submits = 0;
      document.getElementById("login").addEventListener("submit", () => {
        window.__submits += 1;
      });
    </script>
  </body>
</html>
