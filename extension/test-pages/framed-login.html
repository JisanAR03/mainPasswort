<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Framed sign in</title>
  </head>
  <body>
    <form>
      <label>Username <input id="frame-username" type="text" autocomplete="username" /></label>
      <label>Password <input id="frame-password" type="password" autocomplete="current-password" /></label>
      <button type="button">Sign in</button>
    </form>
  </body>
</html>
