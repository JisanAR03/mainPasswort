<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Personal Vault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Personal Vault</h1>
      <button id="lock" class="plain" hidden>Lock</button>
    </header>

    <p id="status" class="status">Checking the vault…</p>

    <section id="setup" hidden>
      <p>Your passwords are kept encrypted in this browser.</p>
      <button id="create">Create a vault</button>
    </section>

    <form id="unlock-form" autocomplete="off" hidden>
      <select id="profile"></select>
      <input id="password" type="password" placeholder="Master password" />
      <button id="unlock-button" type="submit">Unlock</button>
    </form>

    <p id="sync" class="hint" hidden></p>

    <p id="insecure" class="warn" hidden>This page is not secure (http).</p>

    <ul id="matches"></ul>

    <section id="save-prompt" class="prompt" hidden>
      <p id="save-question"></p>
      <div class="row">
        <button id="save-new">Save</button>
        <button id="save-update" hidden>Update</button>
        <button id="save-dismiss" class="plain">Dismiss</button>
      </div>
    </section>

    <form id="add" autocomplete="off" hidden>
      <h2>Add a login for this site</h2>
      <input id="add-username" type="text" placeholder="Username" />
      <div class="row">
        <input id="add-password" type="password" placeholder="Password" />
        <button id="add-suggest" type="button" class="plain" title="Generate a password">
          Suggest
        </button>
      </div>
      <input id="add-title" type="text" placeholder="Title (optional)" />
      <button id="add-save" type="submit">Save login</button>
    </form>

    <label id="watch-row" class="watch">
      <input type="checkbox" id="watch" />
      Offer to save logins
    </label>

    <button id="open-vault" class="plain" hidden>Open vault</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
