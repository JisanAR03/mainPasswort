name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run bandit -q -c pyproject.toml -r app/src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Install KeePassXC (Ubuntu, for the compatibility test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y keepassxc
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q -m "not slow and not e2e"

  slow:
    # The 200-kill crash-during-save loop (I3); too long for the matrix job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Install Qt system libraries (pytest-qt imports QtGui)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - run: uv run pytest -q -m slow

  security:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Install Qt system libraries (pytest-qt imports QtGui)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Canary invariant suite
        run: uv run pytest -q -m security
      - name: Known-vulnerable dependencies
        run: uv run pip-audit
      - name: Secrets in the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # explicit, so the allowlist cannot be missed by config discovery
          GITLEAKS_CONFIG: .gitleaks.toml

  e2e:
    # Playwright extension tests (M4). hashFiles is not allowed in a job-level
    # if, so the step stays a no-op until app/tests/e2e/ exists.
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Install Qt system libraries (the bridge process uses PySide6)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install Chromium for Playwright
        if: hashFiles('app/tests/e2e/**') != ''
        run: uv run playwright install --with-deps chromium
      - name: Extension end-to-end tests
        if: hashFiles('app/tests/e2e/**') != ''
        run: uv run pytest -q -m e2e

  sensitive-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Security-Reviewed-By check (ADR-009)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/check_sensitive_review.py
