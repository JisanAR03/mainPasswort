name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run bandit -q -c pyproject.toml -r app/src
      - name: Vendored extension code matches its pinned hashes
        run: uv run python scripts/check_vendor.py
      - name: No console calls in the extension
        run: uv run python scripts/check_no_console.py

  test:
    # The Python reference implementation (app/): vault read and write, matching,
    # the sync decision table. KeePassXC is installed so the compatibility test runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Install KeePassXC (Ubuntu, for the compatibility test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y keepassxc
      - name: Run tests
        run: uv run pytest -q -m "not slow and not e2e"

  slow:
    # The 200-kill crash-during-save loop (I3); too long for the matrix job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pytest -q -m slow

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Canary invariant suite
        run: uv run pytest -q -m security
      - name: Known-vulnerable dependencies
        run: uv run pip-audit
      - name: Secrets in the full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # explicit, so the allowlist cannot be missed by config discovery
          GITLEAKS_CONFIG: .gitleaks.toml

  e2e:
    # The extension in a real browser (Playwright's Chromium) against a fake Google:
    # create, unlock, fill, save, lock, sync, upgrade. Chrome and Brave are run
    # locally with PV_E2E_BROWSER=chrome|brave.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Install KeePassXC (the compatibility tests open the extension's files in it)
        run: sudo apt-get update && sudo apt-get install -y keepassxc
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: Extension end-to-end tests
        run: uv run pytest -q -m e2e

  sensitive-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - name: Security-Reviewed-By check (ADR-009)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python scripts/check_sensitive_review.py
